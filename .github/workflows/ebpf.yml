name: ebpf

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  EBPF_NIGHTLY: nightly-2026-11-08
  EBPF_MANIFEST: crates/ebpf-probes/ebpf/Cargo.toml

jobs:
  ebpf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the pinned nightly and bpf-linker
        run: lab/ebpf-toolchain.sh 2026-11-08
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            crates/ebpf-probes/ebpf/target
          key: ebpf-${{ runner.os }}-${{ hashFiles('crates/ebpf-probes/ebpf/Cargo.lock') }}
      - name: Check the formatting of the kernel crate
        run: cargo "+$EBPF_NIGHTLY" fmt --check --manifest-path "$EBPF_MANIFEST"
      - name: Build the kernel crate for bpfel-unknown-none
        run: lab/ebpf-build.sh "$EBPF_MANIFEST" "$PWD/crates/ebpf-probes/ebpf/target"
      - name: Refuse a kernel object that names the panic symbol
        run: lab/ebpf-no-panic.sh crates/ebpf-probes/ebpf/target/bpfel-unknown-none/release/ebpf-probes-kernel
      - name: Prove the panic check refuses attack programs
        run: lab/tests/ebpf-no-panic-test.sh
      - name: Lint the kernel crate
        run: cargo "+$EBPF_NIGHTLY" clippy --locked --release --target bpfel-unknown-none -Z build-std=core --manifest-path "$EBPF_MANIFEST" -- -D warnings
      - name: Fail loudly when the runner kernel has no BTF
        run: test -r /sys/kernel/btf/vmlinux || { echo "::error::this runner kernel has no BTF (/sys/kernel/btf/vmlinux is missing), the live probe tests cannot run"; exit 1; }
      - name: Check the license section of the object is exactly Dual MIT/GPL
        run: |
          OBJECT=crates/ebpf-probes/ebpf/target/bpfel-unknown-none/release/ebpf-probes-kernel
          BIN="$(rustc "+$EBPF_NIGHTLY" --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          SCRATCH="$(mktemp -d)"
          "$BIN/llvm-objcopy" --dump-section "license=$SCRATCH/license.bin" "$OBJECT" "$SCRATCH/copy.o"
          printf 'Dual MIT/GPL\0' > "$SCRATCH/expected.bin"
          cmp "$SCRATCH/license.bin" "$SCRATCH/expected.bin"
      - name: Lint the host crate with the loader feature
        run: cargo clippy --locked -p ebpf-probes --all-targets --features ebpf-load -- -D warnings
      - name: Lint the host crate with the live test feature
        run: cargo clippy --locked -p ebpf-probes --all-targets --features ebpf-live-test -- -D warnings
      - name: Lint the Linux agent with the ebpf feature
        run: cargo clippy --locked -p agent-linux --all-targets --features ebpf -- -D warnings
      - name: Install the object root-owned at the path the loader reads
        run: sudo install -D -m 644 -o root -g root crates/ebpf-probes/ebpf/target/bpfel-unknown-none/release/ebpf-probes-kernel /usr/lib/ostyr/ebpf/exec.o
      - name: Run the live tests as root, failing when they cannot run
        run: sudo env "PATH=$PATH" "HOME=$HOME" cargo test --locked -p ebpf-probes --features ebpf-live-test --test live_exec
