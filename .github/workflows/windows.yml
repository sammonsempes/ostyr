name: windows

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the pinned stable toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Run the tests of the Windows-ready crates
        shell: bash
        timeout-minutes: 45
        run: >-
          cargo test --locked
          -p app-health -p core-redact -p device-control
          -p discovery -p grc -p hunt-stats -p metric-alerts
          -p patch-inventory -p patch-rollout
          -p secret-scan -p siem-schema -p sla-report -p software-catalog
          -p vuln-match -p sys-windows -p agent-windows
      - name: Lint sys-windows on Windows
        shell: bash
        timeout-minutes: 15
        run: cargo clippy --locked --all-targets -p sys-windows -- -D warnings
      - name: Run the tests of agent-channel
        shell: bash
        timeout-minutes: 15
        run: >-
          cargo test --locked -p agent-channel --
          --skip a_server_restart_mid_stream_resends_exactly_the_unacknowledged_batches
      - name: Run the agent-channel restart test alone
        if: always()
        shell: bash
        timeout-minutes: 5
        env:
          AGENT_CHANNEL_TRACE: "1"
        run: >-
          cargo test --locked -p agent-channel --
          --exact resilience::a_server_restart_mid_stream_resends_exactly_the_unacknowledged_batches --nocapture
