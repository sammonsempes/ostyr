accounts {
    EVENTS {
        jetstream: enabled
        users: [{ user: admin, password: "adminpw" }]
        exports: [
            { service: "events.*", accounts: [GATEWAY] }
            { service: "dead.events.*", accounts: [SIEM, METRICS] }
        { service: "$JS.API.CONSUMER.INFO.events.siem-ingest", accounts: [SIEM] }
        { service: "$JS.API.CONSUMER.MSG.NEXT.events.siem-ingest", accounts: [SIEM], response_type: stream, response_threshold: "60s" }
        { service: "$JS.ACK.events.siem-ingest.>", accounts: [SIEM] }
        { service: "$JS.API.CONSUMER.INFO.events.metrics-ingest", accounts: [METRICS] }
        { service: "$JS.API.CONSUMER.MSG.NEXT.events.metrics-ingest", accounts: [METRICS], response_type: stream, response_threshold: "60s" }
        { service: "$JS.ACK.events.metrics-ingest.>", accounts: [METRICS] }
        ]
    }
    GATEWAY {
        users: [{
            user: gateway
            password: "gatewaypw"
            permissions: { publish: { allow: ["events.*"] }, subscribe: { allow: ["_INBOX_gateway.>"] } }
        }]
        imports: [{ service: { account: EVENTS, subject: "events.*" } }]
    }
    SIEM {
        users: [{
            user: siem_ingest
            password: "siempw"
            permissions: {
                publish: {
                    allow: [
                        "JS.EVENTS.API.CONSUMER.INFO.events.siem-ingest"
                        "JS.EVENTS.API.CONSUMER.MSG.NEXT.events.siem-ingest"
                        "$JS.ACK.events.siem-ingest.>"
                        "dead.events.*"
                    ]
                }
                subscribe: { allow: ["_INBOX_siem_ingest.>"] }
            }
        }]
        imports: [
            { service: { account: EVENTS, subject: "$JS.API.CONSUMER.INFO.events.siem-ingest" }, to: "JS.EVENTS.API.CONSUMER.INFO.events.siem-ingest" }
            { service: { account: EVENTS, subject: "$JS.API.CONSUMER.MSG.NEXT.events.siem-ingest" }, to: "JS.EVENTS.API.CONSUMER.MSG.NEXT.events.siem-ingest" }
            { service: { account: EVENTS, subject: "$JS.ACK.events.siem-ingest.>" } }
            { service: { account: EVENTS, subject: "dead.events.*" } }
        ]
    }
    METRICS {
        users: [{
            user: metrics_ingest
            password: "metricspw"
            permissions: {
                publish: {
                    allow: [
                        "JS.EVENTS.API.CONSUMER.INFO.events.metrics-ingest"
                        "JS.EVENTS.API.CONSUMER.MSG.NEXT.events.metrics-ingest"
                        "$JS.ACK.events.metrics-ingest.>"
                        "dead.events.*"
                    ]
                }
                subscribe: { allow: ["_INBOX_metrics_ingest.>"] }
            }
        }]
        imports: [
            { service: { account: EVENTS, subject: "$JS.API.CONSUMER.INFO.events.metrics-ingest" }, to: "JS.EVENTS.API.CONSUMER.INFO.events.metrics-ingest" }
            { service: { account: EVENTS, subject: "$JS.API.CONSUMER.MSG.NEXT.events.metrics-ingest" }, to: "JS.EVENTS.API.CONSUMER.MSG.NEXT.events.metrics-ingest" }
            { service: { account: EVENTS, subject: "$JS.ACK.events.metrics-ingest.>" } }
            { service: { account: EVENTS, subject: "dead.events.*" } }
        ]
    }
}
