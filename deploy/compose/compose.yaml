name: ostyr
services:
  postgres:
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    entrypoint:
      - /bin/bash
      - -ec
      - |
        install -d -m 0700 -o postgres -g postgres /run/pgtls
        install -m 0600 -o postgres -g postgres /run/secrets/pg_service_password /run/pgtls/service_password
        install -m 0600 -o postgres -g postgres /run/secrets/pg_server_key /run/pgtls/server.key
        install -m 0644 -o postgres -g postgres /run/secrets/pg_server_cert /run/pgtls/server.crt
        exec docker-entrypoint.sh "$$@"
      - postgres-entrypoint
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pgtls/server.crt
      - -c
      - ssl_key_file=/run/pgtls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    secrets: [pg_password, pg_service_password, pg_server_key, pg_server_cert, pg_ca]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./config/pg-init-service-role.sh:/docker-entrypoint-initdb.d/10-service-role.sh:ro
    tmpfs:
      - /run/pgtls:mode=0700
      - /run/postgresql
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ostyr_service -d ostyr"]
      interval: 5s
      timeout: 5s
      retries: 30
  platform:
    image: ostyr-platform:local
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["/usr/local/bin/ostyr-platform", "/etc/ostyr/module.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [pg_service_password, pg_ca, api_tls_key, api_tls_cert, store_key]
    volumes:
      - ./config:/etc/ostyr:ro
      - state:/var/lib/ostyr
    ports:
      - "0.0.0.0:8443:8443"
  web:
    image: ostyr-platform:local
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["/usr/local/bin/ostyr-web-ui", "/etc/ostyr/web-ui.yaml"]
    depends_on:
      - platform
    secrets: [pg_ca, api_tls_key, api_tls_cert]
    volumes:
      - ./config:/etc/ostyr:ro
      - webstate:/var/lib/ostyr
    networks:
      default:
        ipv4_address: 172.29.63.10
    ports:
      - "0.0.0.0:9443:9443"
  playbooks:
    image: ostyr-platform:local
    pull_policy: never
    restart: unless-stopped
    read_only: true
    user: 65533:65533
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["/usr/local/bin/ostyr-playbooks", "/etc/ostyr/playbooks.yaml"]
    depends_on:
      - platform
    secrets: [playbooks_pg_password, pg_ca]
    volumes:
      - ./config:/etc/ostyr:ro
      - playbooksstate:/var/lib/ostyr-playbooks
  nats:
    image: nats:2.15.2-scratch@sha256:965fc69c168a39f2bfd63a68361288beb0cc64ca60c8c308bf6c0eb74f463b1d
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--config", "/run/secrets/nats_conf"]
    secrets: [nats_conf, nats_server_key, nats_server_cert]
    volumes:
      - natsdata:/data
  gateway:
    image: ostyr-platform:local
    pull_policy: never
    restart: unless-stopped
    read_only: true
    user: 65534:65534
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      RUST_LOG: info
    command: ["/usr/local/bin/ostyr-event-gateway", "/etc/ostyr/gateway-server.yaml", "/etc/ostyr/gateway.yaml"]
    depends_on:
      - nats
    secrets: [pg_ca, gateway_tls_key, gateway_tls_cert, agent_ca, nats_gateway_password]
    volumes:
      - ./config:/etc/ostyr:ro
      - gatewaystate:/var/lib/ostyr-gateway
    networks:
      default:
        ipv4_address: 172.29.63.11
  relay:
    image: ostyr-platform:local
    pull_policy: never
    restart: unless-stopped
    read_only: true
    user: 65531:65531
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["/usr/local/bin/ostyr-relay", "/etc/ostyr/relay.yaml", "/var/lib/ostyr-relay/relay-audit.log"]
    depends_on:
      - gateway
    volumes:
      - ./config:/etc/ostyr:ro
      - relaystate:/var/lib/ostyr-relay
    networks:
      default:
        ipv4_address: 172.29.63.12
    ports:
      - "0.0.0.0:7443:7443"
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.46@sha256:e49863ded96abdc0545bcd0320c1b99c979c18f27915eb6519a5546760d24cb9
    restart: unless-stopped
    read_only: true
    user: 101:101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      CLICKHOUSE_WATCHDOG_ENABLE: 0
    command: ["clickhouse-server", "--config-file=/etc/clickhouse-server/ostyr-config.xml"]
    secrets: [clickhouse_server_key, clickhouse_server_cert, clickhouse_users]
    volumes:
      - chdata:/var/lib/clickhouse
      - ./config/clickhouse-config.xml:/etc/clickhouse-server/ostyr-config.xml:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --no-check-certificate https://localhost:8443/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  chschema:
    image: clickhouse/clickhouse-server:26.8.46@sha256:e49863ded96abdc0545bcd0320c1b99c979c18f27915eb6519a5546760d24cb9
    restart: on-failure:5
    read_only: true
    user: 65530:65530
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["/bin/bash", "/etc/ostyr-schema/apply.sh"]
    depends_on:
      clickhouse:
        condition: service_healthy
    secrets: [pg_ca, clickhouse_schema_password]
    volumes:
      - ./config/clickhouse-apply.sh:/etc/ostyr-schema/apply.sh:ro
      - ./config/clickhouse-schema.sql:/etc/ostyr-schema/schema.sql:ro
    tmpfs:
      - /tmp
      - /var/lib/clickhouse
      - /var/log/clickhouse-server
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.63.0/24
          ip_range: 172.29.63.128/25
volumes:
  pgdata: {}
  state: {}
  webstate: {}
  playbooksstate: {}
  natsdata: {}
  gatewaystate: {}
  relaystate: {}
  chdata: {}
secrets:
  pg_password:
    file: ./secrets/pg_password
  pg_service_password:
    file: ./secrets/pg_service_password
  pg_server_key:
    file: ./secrets/pg_server.key
  pg_server_cert:
    file: ./secrets/pg_server.crt
  pg_ca:
    file: ./secrets/ca.crt
  playbooks_pg_password:
    file: ./secrets/playbooks_pg_password
  api_tls_key:
    file: ./secrets/api_tls.key
  api_tls_cert:
    file: ./secrets/api_tls.crt
  store_key:
    file: ./secrets/store.key
  gateway_tls_key:
    file: ./secrets/gateway_tls.key
  gateway_tls_cert:
    file: ./secrets/gateway_tls.crt
  nats_server_key:
    file: ./secrets/nats_server.key
  nats_server_cert:
    file: ./secrets/nats_server.crt
  nats_conf:
    file: ./secrets/nats.conf
  agent_ca:
    file: ./secrets/agent_ca.crt
  nats_gateway_password:
    file: ./secrets/nats_gateway_password
  clickhouse_server_key:
    file: ./secrets/clickhouse_server.key
  clickhouse_server_cert:
    file: ./secrets/clickhouse_server.crt
  clickhouse_users:
    file: ./secrets/clickhouse_users
  clickhouse_schema_password:
    file: ./secrets/clickhouse_schema_password
