[workspace]
members = ["crates/*", "tools/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
infinite_loop = "deny"
let_underscore_must_use = "deny"
needless_return = "deny"
bool_comparison = "deny"
partialeq_to_none = "deny"
