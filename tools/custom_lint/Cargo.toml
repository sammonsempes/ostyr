[package]
name = "custom_lint"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
granit-parser = "2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
ra-ap-rustc_lexer = "0.181"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
