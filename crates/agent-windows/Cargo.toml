[package]
name = "agent-windows"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-channel = { path = "../agent-channel" }
core-config = { path = "../core-config" }
core-export = { path = "../core-export" }
ecs-normalise = { path = "../ecs-normalise" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "signal"] }
core-audit = { path = "../core-audit" }
sys-windows = { path = "../sys-windows" }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ostyr-agent-windows"
path = "src/bin/ostyr-agent-windows.rs"

[lints]
workspace = true
