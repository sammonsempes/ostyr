[package]
name = "siem-ingest"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
async-nats = { version = "0.52", default-features = false, features = ["ring", "jetstream", "nkeys", "crypto", "server_2_10"] }
bytes = "1.12.1"
core-config = { version = "0.0.0", path = "../core-config" }
futures-util = "0.3.34"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
siem-schema = { version = "0.0.0", path = "../siem-schema" }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
nkeys = "0.4.5"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt", "time", "net", "io-util", "sync", "macros", "test-util"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
