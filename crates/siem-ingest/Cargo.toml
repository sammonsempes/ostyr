[package]
name = "siem-ingest"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tracing = "0.1"

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
tempfile = "3"

[lints]
workspace = true
