[package]
name = "platform"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alert-grouping = { version = "0.0.0", path = "../alert-grouping" }
alerts = { version = "0.0.0", path = "../alerts" }
attack-paths = { version = "0.0.0", path = "../attack-paths" }
axum = "0.8"
cases = { version = "0.0.0", path = "../cases" }
cert-inventory = { version = "0.0.0", path = "../cert-inventory" }
cloud-posture = { version = "0.0.0", path = "../cloud-posture" }
cmdb = { version = "0.0.0", path = "../cmdb" }
compliance = { version = "0.0.0", path = "../compliance" }
core-api = { version = "0.0.0", path = "../core-api" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
dhcp-kea = { version = "0.0.0", path = "../dhcp-kea" }
grc = { version = "0.0.0", path = "../grc" }
hunt-packs = { version = "0.0.0", path = "../hunt-packs" }
oncall = { version = "0.0.0", path = "../oncall" }
remote-shell = { version = "0.0.0", path = "../remote-shell" }
response-playbooks = { version = "0.0.0", path = "../response-playbooks" }
risk-score = { version = "0.0.0", path = "../risk-score" }
status-page = { version = "0.0.0", path = "../status-page" }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
utoipa = "5"
vuln-match = { version = "0.0.0", path = "../vuln-match" }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
core-auth = { version = "0.0.0", path = "../core-auth" }
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
