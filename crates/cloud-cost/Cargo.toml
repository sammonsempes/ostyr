[package]
name = "cloud-cost"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
csv = "1"
metrics-ingest = { version = "0.0.0", path = "../metrics-ingest" }
percent-encoding = "2"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
siem-schema = { version = "0.0.0", path = "../siem-schema" }
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
