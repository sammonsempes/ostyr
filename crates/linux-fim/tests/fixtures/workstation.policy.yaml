apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: ostyr-fim-workstation
spec:
  kprobes:
  - call: security_file_permission
    syscall: false
    args:
    - index: 0
      type: file
    - index: 1
      type: int
    ignore:
      callNotFound: false
    selectors:
    - matchArgs:
      - index: 0
        operator: Equal
        values:
        - /etc/passwd
        - /etc/shadow
        - /etc/sudoers
        - /etc/ld.so.preload
      - index: 1
        operator: Mask
        values:
        - "2"
    - matchArgs:
      - index: 0
        operator: Prefix
        values:
        - /etc/sudoers.d/
        - /etc/cron.d/
      - index: 1
        operator: Mask
        values:
        - "2"
  - call: security_path_truncate
    syscall: false
    args:
    - index: 0
      type: path
    ignore:
      callNotFound: true
    selectors:
    - matchArgs:
      - index: 0
        operator: Equal
        values:
        - /etc/passwd
        - /etc/shadow
        - /etc/sudoers
        - /etc/ld.so.preload
    - matchArgs:
      - index: 0
        operator: Prefix
        values:
        - /etc/sudoers.d/
        - /etc/cron.d/
  - call: security_file_truncate
    syscall: false
    args:
    - index: 0
      type: file
    ignore:
      callNotFound: true
    selectors:
    - matchArgs:
      - index: 0
        operator: Equal
        values:
        - /etc/passwd
        - /etc/shadow
        - /etc/sudoers
        - /etc/ld.so.preload
    - matchArgs:
      - index: 0
        operator: Prefix
        values:
        - /etc/sudoers.d/
        - /etc/cron.d/
  - call: security_path_mknod
    syscall: false
    args:
    - index: 0
      type: path
    ignore:
      callNotFound: false
    selectors:
    - matchArgs:
      - index: 0
        operator: Prefix
        values:
        - /etc/sudoers.d
        - /etc/cron.d
  - call: security_mmap_file
    syscall: false
    args:
    - index: 0
      type: file
    - index: 1
      type: uint32
    - index: 2
      type: uint32
    ignore:
      callNotFound: false
    selectors:
    - matchArgs:
      - index: 0
        operator: Equal
        values:
        - /etc/passwd
        - /etc/shadow
        - /etc/sudoers
        - /etc/ld.so.preload
      - index: 2
        operator: Mask
        values:
        - "1"
    - matchArgs:
      - index: 0
        operator: Prefix
        values:
        - /etc/sudoers.d/
        - /etc/cron.d/
      - index: 2
        operator: Mask
        values:
        - "1"
  - call: security_file_open
    syscall: false
    args:
    - index: 0
      type: file
    - index: 0
      type: uint64
      resolve: f_inode.i_ino
    - index: 0
      type: uint32
      resolve: f_inode.i_sb.s_dev
    ignore:
      callNotFound: false
    selectors:
    - matchArgs:
      - index: 0
        operator: Equal
        values:
        - /root/.aws/credentials
        - /root/passwords.txt
      matchNamespaces:
      - namespace: Mnt
        operator: In
        values:
        - host_ns
      - namespace: User
        operator: In
        values:
        - host_ns
---
