[package]
name = "linux-fim"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
core-config = { path = "../core-config" }
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
