[package]
name = "attack-paths"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
ad-posture = { version = "0.0.0", path = "../ad-posture" }
axum = "0.8"
core-api = { version = "0.0.0", path = "../core-api" }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt", "sync", "time", "signal", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-postgres = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }

[lints]
workspace = true
