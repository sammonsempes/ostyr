[package]
name = "attack-paths"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ad-posture = { version = "0.0.0", path = "../ad-posture" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tracing = "0.1"

[lints]
workspace = true
