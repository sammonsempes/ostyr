[package]
name = "breached-passwords"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
data-encoding = "2"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"

[lints]
workspace = true
