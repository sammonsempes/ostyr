[package]
name = "relay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }
signal-hook = "0.4.6"

[dev-dependencies]
agent-channel = { version = "0.0.0", path = "../agent-channel" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "test-util"] }

[lints]
workspace = true
