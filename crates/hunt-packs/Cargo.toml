[package]
name = "hunt-packs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
core-api = { version = "0.0.0", path = "../core-api" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
data-encoding = "2.11.1"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
metric-alerts = { version = "0.0.0", path = "../metric-alerts" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "signal", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-general-category = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
utoipa = { version = "5", features = ["axum_extras"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
serde_json = "1"
siem-schema = { version = "0.0.0", path = "../siem-schema" }
signal-hook = "0.4.6"
socket2 = "0.6"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "time", "net", "io-util", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
zeroize = "1"

[lints]
workspace = true
