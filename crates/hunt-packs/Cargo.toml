[package]
name = "hunt-packs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
metric-alerts = { version = "0.0.0", path = "../metric-alerts" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
thiserror = "2"
tracing = "0.1"
unicode-general-category = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
siem-schema = { version = "0.0.0", path = "../siem-schema" }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tracing-subscriber = "0.3"
zeroize = "1"

[lints]
workspace = true
