[package]
name = "hunt-packs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
