packs:
  - id: beaconing-regular-interval
    title: Outbound connections at a regular interval
    hypothesis: A compromised host calls its command server at a fixed period
    technique: T1071
    source: clickhouse
    query: >-
      SELECT `host.name`, `destination.ip`, count() AS connections, stddevPop(dateDiff('second', previous, seen)) AS jitter FROM (
      SELECT `host.name`, `destination.ip`, `@timestamp` AS seen, lagInFrame(`@timestamp`) OVER (PARTITION BY `host.name`, `destination.ip` ORDER BY `@timestamp` ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS previous
      FROM events WHERE `tenant` = {tenant:String} AND `@timestamp` >= {window_start:DateTime64(3)} AND `@timestamp` < {window_end:DateTime64(3)}
      AND has(`event.category`, 'network') AND `destination.ip` != '')
      WHERE previous > toDateTime64(0, 3) GROUP BY `host.name`, `destination.ip` HAVING connections > 20 AND jitter < 2 LIMIT 1000
    schedule_seconds: 21600
    window_seconds: 172800
    cost:
      max_rows: 50000
      max_seconds: 60
      max_bytes_read: 4294967296
    baseline:
      max_matches: 0
    tests:
      - corpus: corpus/beacon-60s.ndjson
        expect_matches: 1
