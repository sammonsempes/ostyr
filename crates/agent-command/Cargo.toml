[package]
name = "agent-command"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-audit = { path = "../core-audit" }
core-config = { path = "../core-config" }
data-encoding = "2.11.1"
ed25519-dalek = "3"
getrandom = "0.4.3"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
