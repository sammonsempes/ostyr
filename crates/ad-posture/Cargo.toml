[package]
name = "ad-posture"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
ecs-normalise = { version = "0.0.0", path = "../ecs-normalise" }
serde = { version = "1", features = ["derive"] }
