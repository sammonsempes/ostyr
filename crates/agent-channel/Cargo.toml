[package]
name = "agent-channel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
agent-command = { path = "../agent-command" }
arc-swap = "1.9.3"
axum = { version = "0.8", default-features = false }
core-audit = { path = "../core-audit" }
core-config = { path = "../core-config" }
data-encoding = "2.11.1"
futures-util = "0.3"
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto", "http2", "service"] }
prost = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["net", "time"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
ed25519-dalek = "3"
hyper = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util", "signal"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
