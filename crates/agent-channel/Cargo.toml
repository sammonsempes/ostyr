[package]
name = "agent-channel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
axum = { version = "0.8", default-features = false }
core-audit = { path = "../core-audit" }
futures-util = "0.3"
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto", "http2", "service"] }
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
secrecy = "0.10.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
x509-parser = "0.18"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["time"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
