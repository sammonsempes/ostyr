syntax = "proto3";

package ostyr.agent.v1;

service Heartbeat {
  rpc Beat(BeatRequest) returns (BeatReply);
}

service Events {
  rpc Push(stream EventBatch) returns (stream EventAck);
}

service Commands {
  rpc Subscribe(SubscribeRequest) returns (stream CommandEnvelope);
  rpc Report(CommandReport) returns (ReportReply);
}

service Shell {
  rpc Attach(stream ShellFrame) returns (stream ShellFrame);
}

message BeatRequest {
  string agent_version = 1;
  string tenant = 2;
  string agent_id = 3;
}

message BeatReply {
  string tenant = 1;
  string agent_id = 2;
  uint64 interval_seconds = 3;
}

message EventBatch {
  uint64 sequence = 1;
  bytes ecs_json = 2;
  string tenant = 3;
  string agent_id = 4;
}

message EventAck {
  uint64 sequence = 1;
}

message SubscribeRequest {
  string tenant = 1;
  string agent_id = 2;
}

message CommandEnvelope {
  bytes envelope = 1;
}

message CommandReport {
  bytes envelope_digest = 1;
  bool accepted = 2;
  string reason = 3;
  string tenant = 4;
  string agent_id = 5;
}

message ReportReply {}

enum ShellCloseReason {
  SHELL_CLOSE_REASON_UNSPECIFIED = 0;
  SHELL_CLOSE_REASON_EXITED = 1;
  SHELL_CLOSE_REASON_AGENT_ERROR = 2;
  SHELL_CLOSE_REASON_USER_CLOSE = 3;
  SHELL_CLOSE_REASON_RECORDING_FAILED = 4;
  SHELL_CLOSE_REASON_MAX_DURATION = 5;
  SHELL_CLOSE_REASON_IDLE_TIMEOUT = 6;
  SHELL_CLOSE_REASON_CHANNEL_DEAD = 7;
}

message ShellOpen {
  string session_id = 1;
}

message ShellResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ShellKeepalive {}

message ShellClose {
  ShellCloseReason reason = 1;
}

message ShellFrame {
  oneof frame {
    ShellOpen open = 1;
    bytes data = 2;
    ShellResize resize = 3;
    ShellKeepalive keepalive = 4;
    ShellClose close = 5;
  }
}
