[package]
name = "policy-validator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
