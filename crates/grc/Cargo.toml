[package]
name = "grc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
axum = "0.8"
core-api = { version = "0.0.0", path = "../core-api" }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
csv = "1"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sla-report = { version = "0.0.0", path = "../sla-report" }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "parsing"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
signal-hook = "0.4.6"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-postgres = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }

[lints]
workspace = true
