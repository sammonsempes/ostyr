[package]
name = "virt-inventory"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cmdb = { version = "0.0.0", path = "../cmdb" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_with = { version = "3", default-features = false, features = ["std"] }
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
thiserror = "2"
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
