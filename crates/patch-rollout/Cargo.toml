[package]
name = "patch-rollout"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-command = { version = "0.0.0", path = "../agent-command" }
getrandom = "0.4.3"
core-config = { version = "0.0.0", path = "../core-config" }
response-breakers = { version = "0.0.0", path = "../response-breakers" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = "0.3"

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
data-encoding = "2.11.1"
ed25519-dalek = "3"
tempfile = "3"
time = { version = "0.3", features = ["macros"] }

[lints]
workspace = true
