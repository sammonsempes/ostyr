[package]
name = "dhcp-kea"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
axum = "0.8"
core-api = { version = "0.0.0", path = "../core-api" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
core-export = { version = "0.0.0", path = "../core-export" }
core-pg = { version = "0.0.0", path = "../core-pg" }
ecs-normalise = { version = "0.0.0", path = "../ecs-normalise" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
pg-fake = { version = "0.0.0", path = "../pg-fake" }
signal-hook = "0.4.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util", "io-util", "signal"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-log = "0.2"
tracing-subscriber = "0.3"

[lints]
workspace = true
