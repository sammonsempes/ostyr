[package]
name = "dhcp-kea"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
core-export = { version = "0.0.0", path = "../core-export" }
core-pg = { version = "0.0.0", path = "../core-pg" }
ecs-normalise = { version = "0.0.0", path = "../ecs-normalise" }
serde_json = "1"
thiserror = "2"
time = "0.3"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
