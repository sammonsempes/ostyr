[package]
name = "cloud-posture"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
net-topology = { version = "0.0.0", path = "../net-topology" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = { version = "1", features = ["raw_value"] }
serde_with = { version = "3", default-features = false, features = ["std"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = "0.3"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["process", "fs"] }

[lints]
workspace = true
