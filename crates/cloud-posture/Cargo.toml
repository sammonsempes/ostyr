[package]
name = "cloud-posture"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
axum = "0.8"
core-api = { version = "0.0.0", path = "../core-api" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
net-topology = { version = "0.0.0", path = "../net-topology" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = { version = "1", features = ["raw_value"] }
serde_with = { version = "3", default-features = false, features = ["std"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["process", "fs"] }

[lints]
workspace = true

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
regex = "1"
signal-hook = "0.4.6"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "sync", "time", "net", "signal", "test-util", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-log = "0.2"
tracing-subscriber = "0.3"
