[package]
name = "status-page"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
arc-swap = "1.9.3"
axum = { version = "0.8", default-features = false }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
futures-util = "0.3"
html-escape = "0.2"
ipnet = { version = "2", features = ["serde"] }
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
lru = "0.16"
ppp = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"

[dev-dependencies]
tokio-postgres = "0.7"
tempfile = "3"
time = "0.3"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util", "io-util"] }

[lints]
workspace = true
