[package]
name = "status-page"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
arc-swap = "1.9.3"
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
core-api = { version = "0.0.0", path = "../core-api" }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
futures-util = "0.3"
html-escape = "0.2"
ipnet = { version = "2", features = ["serde"] }
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
lru = "0.16"
ppp = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-postgres = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
time = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-general-category = "1.1.0"
utoipa = { version = "5", features = ["axum_extras"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tracing-log = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util", "io-util"] }

[lints]
workspace = true
