[package]
name = "cert-inventory"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
axum = "0.8"
core-api = { version = "0.0.0", path = "../core-api" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
data-encoding = "2"
psl = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
utoipa = { version = "5", features = ["axum_extras"] }
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(not(unix))'.dependencies]
walkdir = "2"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tempfile = "3"
core-audit = { version = "0.0.0", path = "../core-audit" }
signal-hook = "0.4.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-log = "0.2"
tracing-subscriber = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
