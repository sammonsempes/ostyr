[package]
name = "script-library"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { path = "../core-config" }
data-encoding = "2.11.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
wait-timeout = "0.2"

[lints]
workspace = true
