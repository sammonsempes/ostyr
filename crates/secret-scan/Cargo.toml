[package]
name = "secret-scan"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive", "serde"] }

[dev-dependencies]
data-encoding = "2"
sha2 = "0.10"
tracing-subscriber = "0.3"

[lints]
workspace = true
