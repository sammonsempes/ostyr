[package]
name = "phishing-report"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cases = { version = "0.0.0", path = "../cases" }
data-encoding = "2.11.1"
htmlize = { version = "1.1", features = ["unescape"] }
mail-parser = "0.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
url = "2"

[target.'cfg(unix)'.dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
dhat = "0.3.3"
tempfile = "3"
tracing-subscriber = "0.3"

[lints]
workspace = true
