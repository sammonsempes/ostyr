[package]
name = "web-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Ostyr web interface: server-rendered HTML client of the REST API, login and alert queue"

[dependencies]
arc-swap = "1.9.3"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
core-api = { version = "0.0.0", path = "../core-api" }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
data-encoding = "2.11.1"
maud = "0.27"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
getrandom = "0.4.3"
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "test-util"] }
tokio-stream = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
