[package]
name = "k8s-inventory"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cmdb = { version = "0.0.0", path = "../cmdb" }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_with = { version = "3", default-features = false, features = ["std"] }
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-general-category = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
