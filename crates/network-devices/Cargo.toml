[package]
name = "network-devices"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cmdb = { version = "0.0.0", path = "../cmdb" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde-untagged = "0.1.9"
site-collector = { version = "0.0.0", path = "../site-collector" }
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
core-api = { version = "0.0.0", path = "../core-api" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
