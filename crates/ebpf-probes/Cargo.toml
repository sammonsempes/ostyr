[package]
name = "ebpf-probes"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
ebpf-live = ["dep:aya"]

[dependencies]
aya = { version = "=0.16.0", default-features = false, optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
infinite_loop = "deny"
let_underscore_must_use = "deny"
needless_return = "deny"
bool_comparison = "deny"
partialeq_to_none = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
