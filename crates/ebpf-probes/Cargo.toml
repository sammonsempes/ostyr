[package]
name = "ebpf-probes"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
ebpf-load = ["dep:aya", "dep:tracing"]
ebpf-live-test = ["ebpf-load", "dep:tracing-subscriber"]

[dependencies]
aya = { version = "=0.16.0", default-features = false, optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[[example]]
name = "exec_probe"
required-features = ["ebpf-live-test"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
shadow_same = "deny"
infinite_loop = "deny"
let_underscore_must_use = "deny"
needless_return = "deny"
bool_comparison = "deny"
partialeq_to_none = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
