[package]
name = "ebpf-probes-kernel"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
aya-ebpf = "=0.3.0"

[profile.release]
opt-level = 3
panic = "abort"
debug = 2
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
