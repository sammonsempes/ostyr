[package]
name = "core-auth"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
core-audit = { path = "../core-audit" }
core-config = { path = "../core-config" }
data-encoding = "2.11.1"
openidconnect = { version = "4.1.0", default-features = false, features = ["ureq"] }
getrandom = { version = "0.4.3", features = ["std"] }
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
ureq = "2.12"
time = { version = "0.3", features = ["formatting"] }
totp-lite = "2.0.1"
uuid = "1"
webauthn-rs = { version = "0.6.2", default-features = false, features = ["conditional-ui"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }

[lints]
workspace = true
