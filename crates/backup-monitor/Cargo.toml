[package]
name = "backup-monitor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "macros", "formatting"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal", "net"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
net-topology = { version = "0.0.0", path = "../net-topology" }
rustix = { version = "1.1", features = ["process", "fs"] }
signal-hook = "0.4.6"

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "test-util"] }

[lints]
workspace = true
