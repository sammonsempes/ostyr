[package]
name = "backup-monitor"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
time = { version = "0.3", features = ["parsing", "macros"] }
tracing = "0.1"
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
net-topology = { version = "0.0.0", path = "../net-topology" }
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
