[package]
name = "intel-feeds"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
csv = "1"
idna = "1"
ipnet = "2"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
psl = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_debug"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
unicode-general-category = "1.1.0"
url = "2"
uuid = { version = "1", default-features = false }

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
proptest = "1"
tempfile = "3"
tracing-log = "0.2"
tracing-subscriber = "0.3"

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
signal-hook = "0.4.6"
