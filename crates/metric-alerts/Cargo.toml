[package]
name = "metric-alerts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
core-pg = { version = "0.0.0", path = "../core-pg" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
serde_json = "1"
tracing = "0.1"
core-config = { version = "0.0.0", path = "../core-config" }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
oncall = { version = "0.0.0", path = "../oncall" }
siem-schema = { version = "0.0.0", path = "../siem-schema" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = "1"
core-audit = { version = "0.0.0", path = "../core-audit" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
tracing-subscriber = "0.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
socket2 = "0.6"
tempfile = "3"
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
