[package]
name = "metric-alerts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
oncall = { version = "0.0.0", path = "../oncall" }
siem-schema = { version = "0.0.0", path = "../siem-schema" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
