[package]
name = "metric-alerts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
core-pg = { version = "0.0.0", path = "../core-pg" }
serde_json = "1"
tracing = "0.1"
core-config = { version = "0.0.0", path = "../core-config" }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
oncall = { version = "0.0.0", path = "../oncall" }
siem-schema = { version = "0.0.0", path = "../siem-schema" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
