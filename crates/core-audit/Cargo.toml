[package]
name = "core-audit"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-redact = { path = "../core-redact" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
