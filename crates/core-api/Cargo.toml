[package]
name = "core-api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Ostyr example core module: REST API skeleton with TLS, local accounts, audit and OpenAPI"

[dependencies]
arc-swap = "1.9.3"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
core-audit = { path = "../core-audit" }
core-auth = { path = "../core-auth" }
core-config = { path = "../core-config" }
data-encoding = "2.11.1"
http-body-util = "0.1"
ipnet = "2"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
openidconnect = { version = "4.1.0", default-features = false, features = ["ureq"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
same-file = "1.0.6"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
ureq = "2.12"
utoipa = { version = "5", features = ["axum_extras"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }
signal-hook = "0.4.6"

[dev-dependencies]
getrandom = "0.4.3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"

[lints]
workspace = true

[package.metadata.deb]
name = "ostyr-example-module"
maintainer = "Ostyr <contact@ostyr.invalid>"
section = "admin"
priority = "optional"
depends = "$auto, openssl, adduser"
extended-description = "The example core module every Ostyr module packaging copies: a hardened systemd service running as a dedicated user."
maintainer-scripts = "../../packaging/debian"
systemd-units = { unit-name = "ostyr-example-module", unit-scripts = "../../packaging", enable = true, start = true }
conf-files = ["/etc/ostyr/example-module/module.yaml", "/etc/ostyr/example-module/compromised.txt"]
assets = [
    ["target/release/examples/module_api", "usr/bin/ostyr-example-module", "755"],
    ["target/release/examples/auth_tool", "usr/bin/ostyr-auth-tool", "755"],
    ["target/release/examples/xdrctl", "usr/bin/xdrctl", "755"],
    ["../../packaging/module.yaml", "etc/ostyr/example-module/module.yaml", "644"],
    ["../../packaging/compromised.txt", "etc/ostyr/example-module/compromised.txt", "644"],
    ["../../packaging/README.md", "usr/share/doc/ostyr-example-module/README.md", "644"],
    ["target/release/sbom/core-api.cdx.json", "usr/share/doc/ostyr-example-module/sbom/core-api.cdx.json", "644"],
    ["target/release/sbom/core-auth.cdx.json", "usr/share/doc/ostyr-example-module/sbom/core-auth.cdx.json", "644"],
    ["target/release/sbom/xdrctl.cdx.json", "usr/share/doc/ostyr-example-module/sbom/xdrctl.cdx.json", "644"],
]
