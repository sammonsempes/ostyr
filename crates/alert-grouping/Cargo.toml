[package]
name = "alert-grouping"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
axum = "0.8"
core-api = { version = "0.0.0", path = "../core-api" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
