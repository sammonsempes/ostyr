[package]
name = "ndr"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-export = { version = "0.0.0", path = "../core-export" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tempfile = "3"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
tracing-subscriber = "0.3"

[lints]
workspace = true
