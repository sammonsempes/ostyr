[package]
name = "compliance"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
axum = "0.8"
core-api = { version = "0.0.0", path = "../core-api" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-pg = { version = "0.0.0", path = "../core-pg" }
core-config = { version = "0.0.0", path = "../core-config" }
data-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "formatting"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "test-util", "io-util"] }
tokio-postgres = "0.7"
core-audit = { version = "0.0.0", path = "../core-audit" }
signal-hook = "0.4.6"
tracing-log = "0.2"
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
