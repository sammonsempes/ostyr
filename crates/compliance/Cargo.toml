[package]
name = "compliance"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
core-pg = { version = "0.0.0", path = "../core-pg" }
core-config = { version = "0.0.0", path = "../core-config" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
