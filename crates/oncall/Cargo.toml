[package]
name = "oncall"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
axum = "0.8"
base64 = "0.22"
cap-std = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
core-api = { version = "0.0.0", path = "../core-api" }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
getrandom = "0.4.3"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder"] }
libc = "0.2"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras"] }
webpki-roots = "1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "test-util", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
