[package]
name = "synthetic-checks"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
core-pg = { version = "0.0.0", path = "../core-pg" }
metric-alerts = { version = "0.0.0", path = "../metric-alerts" }
metrics-ingest = { version = "0.0.0", path = "../metrics-ingest" }
serde_json = "1"
sha2 = "0.10"
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
getrandom = "0.4.3"
hickory-resolver = "0.26"
ipnet = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
serde-saphyr = "2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync"] }

[lints]
workspace = true
