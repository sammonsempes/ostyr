[package]
name = "synthetic-checks"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
core-pg = { version = "0.0.0", path = "../core-pg" }
metric-alerts = { version = "0.0.0", path = "../metric-alerts" }
serde_json = "1"
core-config = { version = "0.0.0", path = "../core-config" }
hickory-resolver = "0.26"
ipnet = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
