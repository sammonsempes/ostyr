[package]
name = "agent-linux"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
ebpf = ["ebpf-probes/ebpf-load"]

[dependencies]
agent-channel = { path = "../agent-channel" }
agent-shell = { path = "../agent-shell" }
arc-swap = "1.9.3"
core-audit = { path = "../core-audit" }
core-config = { path = "../core-config" }
core-export = { path = "../core-export" }
ebpf-probes = { path = "../ebpf-probes" }
ecs-normalise = { path = "../ecs-normalise" }
libc = "0.2"
linux-fim = { path = "../linux-fim" }
patch-inventory = { path = "../patch-inventory" }
parking_lot = "0.12"
rustix = { version = "1", features = ["fs", "process", "time"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

[lints]
workspace = true
