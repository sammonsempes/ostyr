[package]
name = "dns-rpz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1"
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
futures-util = "0.3"
html-escape = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
idna = "1"
intel-feeds = { version = "0.0.0", path = "../intel-feeds" }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tokio = { version = "1", features = ["net", "time", "rt", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tracing = "0.1"
wait-timeout = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "time", "rt", "sync", "macros", "rt-multi-thread", "io-util", "test-util"] }
tracing-subscriber = "0.3"

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
signal-hook = "0.4.6"
