[package]
name = "dns-rpz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
idna = "1"
intel-feeds = { version = "0.0.0", path = "../intel-feeds" }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "macros"] }
tracing = "0.1"

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
tracing-subscriber = "0.3"

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
signal-hook = "0.4.6"
