[package]
name = "response-breakers"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tracing = "0.1"

[target.'cfg(unix)'.dev-dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
