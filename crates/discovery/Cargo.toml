[package]
name = "discovery"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
cmdb = { version = "0.0.0", path = "../cmdb" }
core-config = { version = "0.0.0", path = "../core-config" }
core-export = { version = "0.0.0", path = "../core-export" }
core-pg = { version = "0.0.0", path = "../core-pg" }
dhcp-kea = { version = "0.0.0", path = "../dhcp-kea" }
ecs-normalise = { version = "0.0.0", path = "../ecs-normalise" }
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
site-collector = { version = "0.0.0", path = "../site-collector" }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
