[package]
name = "discovery"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
site-collector = { version = "0.0.0", path = "../site-collector" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
