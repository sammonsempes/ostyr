[package]
name = "site-collector"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
arc-swap = "1.9.3"
core-config = { path = "../core-config" }
chrono = { version = "0.4", default-features = false }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
syslog_loose = "0.23"
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
core-audit = { path = "../core-audit" }
proptest = "1"
tempfile = "3"

[lints]
workspace = true
