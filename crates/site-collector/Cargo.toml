[package]
name = "site-collector"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-channel = { path = "../agent-channel" }
arc-swap = "1.9.3"
core-config = { path = "../core-config" }
core-export = { path = "../core-export" }
ecs-normalise = { path = "../ecs-normalise" }
chrono = { version = "0.4", default-features = false }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
syslog_loose = "0.23"
thiserror = "2"
time = "0.3"
tracing = "0.1"
snmp-parser = "0.11.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "rand"] }

[dev-dependencies]
core-audit = { path = "../core-audit" }
proptest = "1"
sha2 = "0.10"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
