[package]
name = "site-collector"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false }
crc32fast = "1"
syslog_loose = "0.23"
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
