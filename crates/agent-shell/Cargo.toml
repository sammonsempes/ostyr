[package]
name = "agent-shell"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-channel = { path = "../agent-channel" }
agent-command = { path = "../agent-command" }
atomicwrites = "0.4.4"
bytes = "1"
core-audit = { path = "../core-audit" }
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["time"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server-auto", "http2", "service"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util", "io-util"] }
tokio-stream = { version = "0.1", features = ["net", "time"] }

[lints]
workspace = true
