[package]
name = "remote-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-command = { path = "../agent-command" }
core-audit = { path = "../core-audit" }
core-config = { path = "../core-config" }
core-pg = { path = "../core-pg" }
data-encoding = "2.11.1"
ed25519-dalek = "3"
getrandom = "0.4.3"
rustix = { version = "1.1", features = ["process"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
