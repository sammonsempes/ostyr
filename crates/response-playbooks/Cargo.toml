[package]
name = "response-playbooks"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
core-audit = { version = "0.0.0", path = "../core-audit" }
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
humantime = "2"
minijinja = { version = "3", default-features = false, features = ["builtins", "fuel", "serde", "unstable_machinery"] }
response-breakers = { version = "0.0.0", path = "../response-breakers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = "0.3"
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
pg-fake = { version = "0.0.0", path = "../pg-fake" }
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true
