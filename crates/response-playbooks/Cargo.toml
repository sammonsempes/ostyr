[package]
name = "response-playbooks"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
humantime = "2"
minijinja = { version = "3", default-features = false, features = ["builtins", "fuel", "serde"] }
response-breakers = { version = "0.0.0", path = "../response-breakers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dev-dependencies]
signal-hook = "0.4.6"

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
tempfile = "3"
time = "0.3"

[lints]
workspace = true
