[package]
name = "metrics-ingest"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
core-config = { version = "0.0.0", path = "../core-config" }
core-pg = { version = "0.0.0", path = "../core-pg" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_debug"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "0.14"
unicode-general-category = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
siem-ingest = { version = "0.0.0", path = "../siem-ingest" }
siem-schema = { version = "0.0.0", path = "../siem-schema" }
thiserror = "2"
time = "0.3"
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_debug"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tracing-subscriber = "0.3"

[lints]
workspace = true
