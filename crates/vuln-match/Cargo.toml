[package]
name = "vuln-match"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alerts = { version = "0.0.0", path = "../alerts" }
axum = "0.8"
core-api = { version = "0.0.0", path = "../core-api" }
core-auth = { version = "0.0.0", path = "../core-auth" }
core-pg = { version = "0.0.0", path = "../core-pg" }
core-config = { version = "0.0.0", path = "../core-config" }
debversion = { version = "0.5", default-features = false }
rpm-version = "0.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde-human-readable", "formatting"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }

[dev-dependencies]
core-audit = { version = "0.0.0", path = "../core-audit" }
pg-fake = { version = "0.0.0", path = "../pg-fake" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
signal-hook = "0.4.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "test-util", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-log = "0.2"
tracing-subscriber = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
time = { version = "0.3", features = ["macros"] }

[lints]
workspace = true
